name: Magger Weekly

on:
  push:
    branches:
      - main
  schedule:
    # Prepare a review queue every Sunday; scheduled runs never email automatically.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: Choose whether to gather candidates or publish an approved draft
        required: true
        type: choice
        options:
          - review
          - publish
        default: review
      draft_run_id:
        description: Optional review run ID; leave blank to use the latest available review draft (publish only)
        required: false
        type: string
      include:
        description: Candidate numbers to include, comma-separated (publish only; e.g. 1,3,4)
        required: false
        type: string
      extra_urls:
        description: Additional article URLs, one per line (publish only)
        required: false
        type: string
      no_email:
        description: Build preview EPUB without sending it to Kindle
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: magger-weekly
  cancel-in-progress: false

jobs:
  magger:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Magger
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Prepare RSS review queue
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'review' }}
        run: python -m magger.approval review

      - name: Upload review draft
        if: ${{ github.event_name == 'schedule' || inputs.mode == 'review' }}
        uses: actions/upload-artifact@v4
        with:
          name: magger-draft-${{ github.run_id }}
          path: draft/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Resolve review run ID
        id: review_run
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
        env:
          REQUESTED_RUN_ID: ${{ inputs.draft_run_id }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$REQUESTED_RUN_ID" ]; then
            run_id="$REQUESTED_RUN_ID"
          else
            artifact_name="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" --jq '[.artifacts[] | select(.expired == false and (.name | startswith("magger-draft-")))] | sort_by(.created_at) | last | .name // empty')"
            if [ -z "$artifact_name" ]; then
              echo "::error::No unexpired Magger review draft found. Run mode=review first, or provide draft_run_id."
              exit 1
            fi
            run_id="${artifact_name#magger-draft-}"
            echo "No draft_run_id provided; using latest review artifact from run $run_id."
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download reviewed draft
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
        uses: actions/download-artifact@v4
        with:
          name: magger-draft-${{ steps.review_run.outputs.run_id }}
          path: draft
          run-id: ${{ steps.review_run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and deliver approved edition
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' }}
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KINDLE_SENDER_EMAIL: ${{ secrets.KINDLE_SENDER_EMAIL }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
          APPROVED_INCLUDE: ${{ inputs.include }}
          APPROVED_URLS: ${{ inputs.extra_urls }}
          PREVIEW_ONLY: ${{ inputs.no_email }}
        run: |
          args=(publish --draft draft/manifest.json --include "$APPROVED_INCLUDE" --extra-urls "$APPROVED_URLS")
          if [ "$PREVIEW_ONLY" = "true" ]; then args+=(--no-email); fi
          python -m magger.approval "${args[@]}"

      - name: Upload EPUB artifact
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: magger-epub-${{ github.run_number }}
          path: dist/*.epub
          if-no-files-found: warn
          retention-days: 30

      - name: Persist deduplication state
        if: success() && github.event_name == 'workflow_dispatch' && inputs.mode == 'publish' && inputs.no_email != true
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen.json
            git commit -m "Update Magger deduplication state"
            git push
          fi
