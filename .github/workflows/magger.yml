name: Magger Weekly

on:
  schedule:
    # GitHub scheduled workflows use UTC; this runs Sundays at 12:00 UTC.
    - cron: "0 12 * * 0"
  workflow_dispatch:
    inputs:
      no_email:
        description: Build an EPUB but skip Kindle email delivery
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: magger-weekly
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Magger
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Run tests
        run: pytest -q

      - name: Build and deliver RSS-only magazine
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          KINDLE_SENDER_EMAIL: ${{ secrets.KINDLE_SENDER_EMAIL }}
          KINDLE_EMAIL: ${{ secrets.KINDLE_EMAIL }}
        run: |
          if [ "${{ inputs.no_email }}" = "true" ]; then
            python -m magger --no-email
          else
            python -m magger
          fi

      - name: Upload EPUB artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magger-epub-${{ github.run_number }}
          path: dist/*.epub
          if-no-files-found: warn
          retention-days: 30

      - name: Persist deduplication state
        if: success()
        run: |
          if ! git diff --quiet -- data/seen.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/seen.json
            git commit -m "Update Magger deduplication state"
            git push
          fi
