# Curated for substantial technical writing: research, engineering case studies,
# architecture, reliability, and engineering leadership. No aggregators or forums.
feeds:
  # Research papers: selected computer-science areas, rather than the full arXiv firehose.
  - name: arXiv - Software Engineering
    url: https://export.arxiv.org/rss/cs.SE
  - name: arXiv - Distributed, Parallel, and Cluster Computing
    url: https://export.arxiv.org/rss/cs.DC
  - name: arXiv - Programming Languages
    url: https://export.arxiv.org/rss/cs.PL
  - name: arXiv - Databases
    url: https://export.arxiv.org/rss/cs.DB
  - name: arXiv - Machine Learning
    url: https://export.arxiv.org/rss/cs.LG
  - name: arXiv - Cryptography and Security
    url: https://export.arxiv.org/rss/cs.CR

  # Edited technical publications and engineering case studies.
  - name: ACM Queue
    url: https://queue.acm.org/rss/feeds/queue.rss
  - name: USENIX Publications
    url: https://www.usenix.org/rss
  - name: Netflix TechBlog
    url: https://medium.com/feed/netflix-techblog
  - name: Cloudflare Engineering
    url: https://blog.cloudflare.com/rss/
  - name: Martin Fowler
    url: https://martinfowler.com/feed.atom
  - name: IEEE Spectrum
    url: https://spectrum.ieee.org/rss/fulltext

  # Long-form reporting and engineering leadership / management.
  - name: LeadDev - The Shift
    url: https://leaddeveic.substack.com/feed
  - name: First Round Review
    url: https://review.firstround.com/articles/rss

  # Philosophy, history, progress, and ideas: essay-led publications.
  - name: Aeon
    url: https://aeon.co/feed.rss
  - name: JSTOR Daily
    url: https://daily.jstor.org/feed/
  - name: LSE Review of Books
    url: https://blogs.lse.ac.uk/lsereviewofbooks/feed/
  - name: NOEMA
    url: https://www.noemamag.com/feed/
  - name: Works in Progress
    url: https://worksinprogress.co/rss.xml
  - name: The Conversation (US)
    url: https://theconversation.com/us/articles.atom

  # Organizational behavior, leadership, and management practice.
  # Independent writing on Muslim nonprofits, leadership, and Islamic estate planning.
  - name: Working Towards Ehsan Newsletter
